name: Build DOMATES APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('domates/**/*.gradle*', 'domates/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p domates/gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o domates/gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        run: chmod +x domates/gradlew

      - name: Build Release APK
        working-directory: domates
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOMATES-release
          path: domates/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK=domates/app/build/outputs/apk/release/app-release.apk
          echo "APK size: $(du -sh $APK | cut -f1)"
          echo "Build successful ✓"
